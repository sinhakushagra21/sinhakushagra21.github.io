# Render Blueprint — deploys the FastAPI backend.
# In Render: New → Blueprint → pick this repo. It reads this file.
# Set the three sync:false secrets in the dashboard after the first deploy.
services:
  - type: web
    name: kushagra-portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: OPENAI_API_KEY
        sync: false # set in dashboard — used for embeddings + generation
      - key: ALLOWED_ORIGINS
        sync: false # your Vercel URL, e.g. https://your-app.vercel.app
      - key: NOTES_VIEW_KEY
        sync: false # secret to view the private visitor-notes inbox
